<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library</title>
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>Library</h1>
        <button id="open-dialog">
          <img src="./img/add.svg" /><span>Add Book</span>
        </button>
      </header>
      <ul id="library"></ul>
      <dialog closedby="any">
        <hgroup>
          <h2>Add a Book to your Library</h2>

          <button id="close-dialog" autofocus>
            <img src="./img/close.svg" />
          </button>
        </hgroup>
        <form action="">
          <p>
            <label for="name">Name:</label>
            <input type="text" name="name" id="name" autofocus required />
          </p>
          <p>
            <label for="author">Author:</label>
            <input type="text" name="author" id="author" required />
          </p>
          <p>
            <label for="pages">Pages:</label>
            <input type="number" min="0" name="pages" id="pages" required />
          </p>
          <p>
            <input type="checkbox" min="0" name="is-read" id="is-read" />
            <label for="is-read">Did you already read the book?</label>
          </p>
          <button type="submit" formmethod="dialog">
            <img src="./img/add.svg" />
            <span>Add Book</span>
          </button>
        </form>
      </dialog>
    </main>
  </body>
</html>
