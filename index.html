<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <ul id="library"></ul>
      <button id="open-dialog">New Book</button>
      <dialog closedby="any">
        <button id="close-dialog" autofocus>Close</button>
        <form action="">
          <p>
            <label for="name">Name:</label>
            <input type="text" name="name" id="name" autofocus />
          </p>
          <p>
            <label for="author">Author:</label>
            <input type="text" name="author" id="author" />
          </p>
          <p>
            <label for="pages">Pages:</label>
            <input type="number" min="0" name="pages" id="pages" />
          </p>
          <p>
            <label for="pages">Is read?:</label>
            <input type="checkbox" min="0" name="is-read" id="is-read" />
          </p>
          <button type="submit" formmethod="dialog">Add Book</button>
        </form>
      </dialog>
    </main>
  </body>
  <script src="script.js"></script>
</html>
